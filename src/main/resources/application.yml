spring:
  application:
    name: payments-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
