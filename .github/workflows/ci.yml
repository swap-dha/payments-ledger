name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub-hosted runners include Docker, so the Testcontainers integration tests run here.
      - name: Build and test
        run: mvn -B verify
